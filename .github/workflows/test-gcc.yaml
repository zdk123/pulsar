name: Test GCC + OpenMP

on: [push, pull_request]

jobs:
  test-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev libgomp1 libgmp-dev libglpk-dev

      # Test dependencies come as binaries from the public RSPM repo set by
      # setup-r; only huge is built from source, against GCC + libgomp, which
      # is what this job checks. Fail here if anything is missing, since
      # install.packages() only warns.
      - name: Install R deps
        run: |
          Rscript -e '
            pkgs <- c("testthat", "Matrix", "batchtools", "fs", "checkmate", "MASS",
                      "clime", "orca", "glmnet", "network", "cluster", "knitr", "rmarkdown",
                      "future", "processx")
            # binary huge first so its dependencies are binaries too, then rebuild it
            install.packages(c(pkgs, "huge"), repos = Sys.getenv("RSPM"))
            # warn = 2: a failed source build is an error, not a silent fall back to the binary
            options(warn = 2)
            install.packages("huge", type = "source", repos = "https://cloud.r-project.org")
            missing <- setdiff(c(pkgs, "huge"), rownames(installed.packages()))
            if (length(missing)) stop("Failed to install: ", paste(missing, collapse = ", "))
          '

      - name: Install pulsar
        run: R CMD INSTALL .

      - name: Verify huge uses libgomp
        run: |
          Rscript -e 'cat(system2("ldd", c(system.file("libs", "huge.so", package="huge")), stdout=TRUE), sep="\n")'

      - name: Run tests
        run: Rscript -e 'library(testthat); library(pulsar); test_check("pulsar")'
        env:
          # run the skip_on_cran() tests (multi-process backends) too
          NOT_CRAN: "true"
        working-directory: tests
        timeout-minutes: 10
